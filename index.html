<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nick Vuci — Xenharmonic Musician</title>
    <meta name="description" content="Music in equal temperaments and just intonation beyond twelve tones, with tools for composing and studying microtonal harmony.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nick Vuci">
    <meta property="og:title" content="Nick Vuci — Xenharmonic Musician">
    <meta property="og:description" content="Music in equal temperaments and just intonation beyond twelve tones, with tools for composing and studying microtonal harmony.">
    <meta property="og:url" content="https://nickvuci.com/">
    <meta property="og:image" content="https://nickvuci.com/favicon/android-chrome-512x512.png">
    <meta name="twitter:card" content="summary">

    <!-- Favicons: the NV app icon -->
    <link rel="icon" href="favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">

    <!-- Browser chrome follows the band header -->
    <meta name="theme-color" content="#2e0f16" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#331120" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Apply a remembered light/dark choice before the CSS loads, so the page never flashes -->
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>

    <!-- Typefaces: Cormorant Garamond (display), Montserrat (text), IBM Plex Mono (notation) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <!-- Site CSS (production): minified modular bundle -->
    <link rel="stylesheet" href="css/dist/app.min.css">
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="header">
        <button type="button" class="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">
            <svg class="icon theme-icon theme-icon--moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M19.5 14.2A7.5 7.5 0 0 1 9.8 4.5a7.5 7.5 0 1 0 9.7 9.7Z"/></svg>
            <svg class="icon theme-icon theme-icon--sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        </button>
        <div class="lockup">
            <img class="monogram" src="assets/nv-mark-dark.svg" alt="" width="139" height="56">
            <div class="lockup-text">
                <p class="wordmark"><span class="wordmark-nick">Nick</span> <span class="wordmark-vuci">Vuci</span></p>
                <p class="descriptor">Xenharmonic Musician</p>
            </div>
        </div>

        <nav class="nav-buttons" aria-label="Primary">
            <a class="nav-link" href="#page=about" data-page="about">About</a>
            <a class="nav-link" href="#page=music-list" data-page="music-list">Music</a>
            <a class="nav-link" href="#page=tools" data-page="tools">Tools</a>
            <a class="nav-link" href="#page=contact" data-page="contact">Contact</a>
        </nav>
    </header>

    <main class="main-content">
        <div id="content" class="content" tabindex="-1" aria-live="polite"></div>
    </main>

    <footer class="footer">
        <!-- Audio player is built here by js/player.js -->
        <div class="player-mount"></div>
        <p class="site-credit">&copy; <span id="year">2026</span> Nick Vuci. All rights reserved.</p>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/tracks.js"></script>
    <script defer src="js/player.js"></script>
    <script defer src="main.js"></script>
</body>
</html>
