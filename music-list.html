<!-- Temporary Music List Page -->
<div class="section-hero">
  <div class="section-card fade-in">
    <h3>A Selection of My Music</h3>
    <style>
      /* Scoped tweaks for the temporary music list */
      .music-list .all-tracks-list { list-style: none; padding-left: 0; margin: 0; }
      .music-list .track-row-inner { display: flex; align-items: center; gap: var(--spacing-sm); }
      .music-list .play-icon { background: none; border: none; color: var(--primary-gold); padding: 0; line-height: 1; transform: translateX(-8px); }
      /* Sort controls */
      .music-list .sort-bar { display: flex; align-items: center; gap: var(--spacing-sm); flex-wrap: wrap; margin-bottom: var(--spacing-sm); }
      .music-list .sort-label { opacity: 0.85; }
      .music-list .sort-btn { appearance: none; background: none; border: 1px solid transparent; color: var(--primary-gold); cursor: pointer; padding: 4px 10px; border-radius: 6px; font: inherit; }
      .music-list .sort-btn:hover { border-color: rgba(255,255,255,0.15); }
      .music-list .sort-btn.active { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
      .music-list .sort-btn .dir { margin-left: 6px; opacity: 0.8; font-size: 0.9em; }
    </style>
    <!--
    <p>This is a temporary list of all tracks while the full music page is in progress.</p> 

    <div id="collection-stats" class="collection-stats">
      <p><strong>Collection:</strong> <span id="total-tracks">0</span> tracks</p>
    </div>
    -->
    <div class="music-list" id="all-tracks-list" aria-live="polite"></div>
  </div>
</div>
